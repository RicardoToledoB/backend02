# ==========================================================
# Configuracion comun - Gestion Demanda API
# ==========================================================
spring.application.name=gestiondemanda-api

# Perfil por defecto: dev. Para MySQL local usar SPRING_PROFILES_ACTIVE=local-mysql.
# Para servidor usar SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Puerto interno del backend.
# 8080, 8086 y 8888 quedan libres para otros servicios del servidor.
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8095}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-docs

# JWT
app.jwt.secret=${JWT_SECRET:change_me_with_a_very_long_random_256bit_secret___________________________}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:86400000}

# CORS local + produccion.
# Frontend produccion: https://gestiondemanda.dssm.cl
# Backend produccion:  https://gestiondemanda-api.dssm.cl
# Local Angular:       http://localhost:4200 / http://127.0.0.1:4200 / IP LAN
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:4200,http://127.0.0.1:4200,http://192.168.*:*,https://gestiondemanda.dssm.cl,https://gestiondemanda-api.dssm.cl}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:false}

# Directorio de documentos subidos
app.documents.storage-dir=${DOCUMENT_STORAGE_DIR:./storage/demand-documents}

# Zona horaria institucional para respuestas de hora del servidor
app.time.zone=${APP_TIME_ZONE:America/Punta_Arenas}

# Correo SMTP. Por defecto queda deshabilitado.
app.email.enabled=${EMAIL_ENABLED:true}
app.email.from=${EMAIL_FROM:${SMTP_USERNAME:mensajedssm@gmail.com}}
app.email.from-name=${EMAIL_FROM_NAME:Gestion Demanda DSSM}
spring.mail.host=${SMTP_HOST:${MAIL_HOST:smtp.gmail.com}}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:${MAIL_USERNAME:mensajedssm@gmail.com}}
spring.mail.password=${SMTP_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.ssl.trust=${SMTP_SSL_TRUST:${SMTP_HOST:smtp.gmail.com}}
spring.mail.properties.mail.debug=${SMTP_DEBUG:false}
