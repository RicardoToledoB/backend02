# ==========================================================
# Perfil DEV - H2 en memoria
# ==========================================================
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.sql.init.mode=embedded
spring.jpa.defer-datasource-initialization=true

spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.springframework.security=DEBUG

# JWT refresh token
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:86400000}

# Directorio de documentos subidos
app.documents.storage-dir=${DOCUMENT_STORAGE_DIR:./storage/demand-documents}

# Zona horaria institucional para respuestas de hora del servidor
app.time.zone=${APP_TIME_ZONE:America/Punta_Arenas}
