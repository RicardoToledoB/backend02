# ==========================================================
# Perfil LOCAL-MYSQL - MySQL local en Mac/desarrollo
# Ejecutar con: SPRING_PROFILES_ACTIVE=local-mysql ./mvnw spring-boot:run
# ==========================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/demanda_drogas?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:demanda_user}
spring.datasource.password=${DB_PASSWORD:Demanda123$}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.springframework.security=DEBUG
