# ==========================================================
# Perfil PROD - Servidor gestiondemanda-api.dssm.cl
# Recomendado con Nginx/Apache como proxy HTTPS hacia localhost:8095
# Ejecutar con: SPRING_PROFILES_ACTIVE=prod
# ==========================================================
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8095}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/demanda_drogas?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:demanda_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

spring.jpa.show-sql=${SHOW_SQL:false}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.type.descriptor.sql=${HIBERNATE_BIND_LOG_LEVEL:WARN}
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:INFO}

app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://gestiondemanda.dssm.cl,https://gestiondemanda-api.dssm.cl,http://localhost:4200,http://127.0.0.1:4200,http://192.168.*:*}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:false}

# JWT refresh token
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:86400000}

# Directorio de documentos subidos
app.documents.storage-dir=${DOCUMENT_STORAGE_DIR:/var/www/gestiondemanda-api/documents}

# Zona horaria institucional para respuestas de hora del servidor
app.time.zone=${APP_TIME_ZONE:America/Punta_Arenas}

# Correo institucional SMTP
# Activar solo cuando existan credenciales SMTP válidas.
app.email.enabled=${EMAIL_ENABLED:true}
app.email.from=${EMAIL_FROM:${SMTP_USERNAME:no-reply@dssm.cl}}
app.email.from-name=${EMAIL_FROM_NAME:Gestion Demanda DSSM}
spring.mail.host=${SMTP_HOST:${MAIL_HOST:}}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${SMTP_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.ssl.trust=${SMTP_SSL_TRUST:${SMTP_HOST:}}
spring.mail.properties.mail.debug=${SMTP_DEBUG:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT:10000}
