# ==========================================================
# Perfil PROD - Servidor gestiondemanda-api.dssm.cl
# Recomendado con Nginx/Apache como proxy HTTPS hacia localhost:8095
# Ejecutar con: SPRING_PROFILES_ACTIVE=prod
# ==========================================================
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8095}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/demanda_drogas?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:demanda_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

spring.jpa.show-sql=${SHOW_SQL:false}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.type.descriptor.sql=${HIBERNATE_BIND_LOG_LEVEL:WARN}
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:INFO}

app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://gestiondemanda.dssm.cl,https://gestiondemanda-api.dssm.cl,http://localhost:4200,http://127.0.0.1:4200,http://192.168.*:*}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:false}
